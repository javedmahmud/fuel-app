name: CI

# Runs on every PR into staging or main, and on pushes to those branches directly (the
# staging -> main promotion merge) — see `14_DEPLOYMENT.md` §14.1.1 for the branching model
# this mirrors, and the dev-workflow rule that tests must run in CI, not just locally.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Upload regenerated lockfile (temporary — debugging cross-platform npm ci failure)
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-linux
          path: package-lock.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (web + worker)
        run: npm run build
